<script src="../../common.js"></script>
<script>
async function loadDetail(){
 const params=new URLSearchParams(location.search);
 const id=params.get('id');
 if(!id){document.getElementById('detailContent').innerHTML='<div class="error">缺少ID参数</div>';return;}
 try{
  const res=await fetch('/api/office/'+encodeURIComponent(id));
  if(!res.ok)throw new Error();
  const d=await res.json();
  document.getElementById('detailTitle').textContent=d.title;
  let html='';
  html+='<div class="detail-section"><div class="detail-label">描述</div><div class="detail-value">'+(d.desc||'暂无')+'</div></div>';
  html+='<div class="detail-section"><div class="detail-label">详细内容</div><div class="detail-value">'+(d.detail||'暂无')+'</div></div>';
  if(d.configs&&Object.keys(d.configs).length>0){html+='<div class="detail-section"><div class="detail-label">配置示例</div><div class="detail-value"><pre>'+(Object.values(d.configs)[0]||'暂无')+'</pre></div></div>';}
  if(d.docs&&Object.keys(d.docs).length>0){html+='<div class="detail-section"><div class="detail-label">参考文档</div><div class="detail-value"><ul>'+Object.values(d.docs).map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul></div></div>';}
  if(d.created_at){html+='<div class="detail-section"><div class="detail-label">创建时间</div><div class="detail-value">'+d.created_at+'</div></div>';}
  document.getElementById('detailContent').innerHTML=html;
 }catch(e){document.getElementById('detailContent').innerHTML='<div class="error">加载失败: '+e.message+'</div>';}
}
document.addEventListener('DOMContentLoaded',function(){loadDetail();initSidebarDropdowns();});
</script>
