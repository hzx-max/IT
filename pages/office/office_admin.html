<div class="main-wrap">
<div class="page">
<div class="top-bar">
<h2>管理Office办公</h2>
<div class="top-actions">
<button class="btn btn-primary" onclick="location.href='office_add.html'">添加Office办公</button>
</div>
</div>
<div class="search-row">
<input type="text" id="searchInput" placeholder="搜索Office办公..." autocomplete="off">
<select id="vendorFilter"><option value="">全部厂商</option></select>
</div>
<div id="noResult" class="no-result" style="display:none;text-align:center;padding:60px 20px;color:#94a3b8;font-size:16px">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:16px;opacity:.4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><br>没有匹配的结果
</div>
<div class="table-wrap">
<table class="data-table">
<thead><tr>
<th style="width:40px"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
<th style="width:60px">序号</th>
<th>标题</th>
<th>厂商</th><th>分类</th>
<th style="width:120px">创建时间</th>
<th style="width:180px">操作</th>
</tr></thead>
<tbody id="adminTbody"></tbody>
</table>
</div>
<div class="batch-bar" id="batchBar" style="display:none">
<span id="selectedCount">已选择 0 项</span>
<button class="btn btn-danger" onclick="batchDelete()">批量删除</button>
</div>
</div>
</div>
<script src="../../common.js"></script>
<script>
let offices = [];
let deleteIds = new Set();

async function loadList(){try{const r=await fetch('/api/office');if(!r.ok)throw new Error();offices=await r.json();renderTable();}catch(e){console.error(e);}}

function renderTable(){
 const s=document.getElementById('searchInput').value.trim().toLowerCase();
 let list=offices;
 const vf=document.getElementById("vendorFilter");const activeV=vf?.(vf.value||"");if(activeV)list=list.filter(d=>d.vendor===activeV);
 if(s)list=list.filter(d=>d.title.toLowerCase().includes(s));
 const tbody=document.getElementById('adminTbody');
 const no=document.getElementById('noResult');
 if(list.length===0){tbody.innerHTML='';no.style.display='block';return;}
 no.style.display='none';
 tbody.innerHTML=list.map((d,i)=>`<tr>
<td><input type="checkbox" class="select-item" value="${d.id}" ${deleteIds.has(d.id)?'checked':''} onchange="toggleItem(this)"></td>
<td>${i+1}</td>
<td>${esc(d.title)}</td>
<td>${getVendorName(d.vendor)}</td><td>${getCatLabel(d.cat)}</td>
<td>${d.created_at||''}</td>
<td>
<button class="btn btn-sm btn-outline" onclick="location.href='office_detail.html?id=${d.id}'">查看</button>
<button class="btn btn-sm btn-outline" onclick="location.href='office_edit.html?id=${d.id}'">编辑</button>
<button class="btn btn-sm btn-danger" onclick="deleteItem('${d.id}')">删除</button>
</td>
</tr>`).join('');
}

function toggleSelectAll(){const cb=document.getElementById('selectAll');document.querySelectorAll('.select-item').forEach(c=>{c.checked=cb.checked;if(cb.checked)deleteIds.add(c.value);else deleteIds.delete(c.value);});updateBatchBar();}
function toggleItem(cb){if(cb.checked)deleteIds.add(cb.value);else deleteIds.delete(cb.value);updateBatchBar();}
function updateBatchBar(){const el=document.getElementById('batchBar');const cnt=deleteIds.size;el.style.display=cnt?'flex':'none';document.getElementById('selectedCount').textContent='已选择 '+cnt+' 项';}

async function deleteItem(id){if(!confirm('确定要删除吗？'))return;try{await fetch('/api/office/'+encodeURIComponent(id),{method:'DELETE'});loadList();}catch(e){alert('删除失败');}}

async function batchDelete(){if(deleteIds.size===0||!confirm('确定要批量删除 '+deleteIds.size+' 项吗？'))return;try{const res=await fetch('/api/office/batch-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...deleteIds]})});if(!res.ok)throw new Error();deleteIds.clear();loadList();updateBatchBar();}catch(e){alert('批量删除失败');}}

document.getElementById('searchInput').addEventListener('input',renderTable);
const vf=document.getElementById('vendorFilter');const vm=window.OFFICE_VENDOR_MAP;Object.entries(vm).forEach(([k,v]) =>{const o=document.createElement("option");o.value=k;o.textContent=v.n;vf.appendChild(o);}); vf.addEventListener("change",renderTable);
document.addEventListener('DOMContentLoaded',async function(){await loadData();loadList();initSidebarDropdowns();});
</script>
