<div class="main-wrap">
<div class="page">
<div class="top-bar">
<h2>管理网络命令</h2>
<div class="top-actions"><span id="statsLabel" class="stats-label" style="font-size:15px;color:var(--text-muted);font-weight:500">共0条</span></div>
</div>
<div class="search-row" style="position:relative">
<input type="text" id="searchInput" placeholder="搜索网络命令..." autocomplete="off">
<select id="vendorFilter"><option value="">全部厂商</option></select>
<select id="catFilter"><option value="">全部分类</option></select>
</div>
<div id="noResult" class="no-result" style="display:none">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><br>没有匹配的结果
</div>
<div class="admin-table-wrap">
<table class="data-table">
<thead><tr>
<th style="width:40px"><input type="checkbox" id="selectAll"></th>
<th style="width:60px">序号</th>
<th>标题</th>
<th>厂商</th><th>分类</th>
<th style="width:120px">创建时间</th>
<th style="width:180px">操作</th>
</tr></thead>
<tbody id="adminTbody"></tbody>
</table>
</div>
<div class="batch-bar" id="batchBar" style="display:none">
<span class="selected-count" id="selectedCount">已选择 0 项</span>
<button class="btn btn-danger" onclick="_batchDelete()">删除（删除选择的）</button>
</div>
</div>

<script src="../../common.js?v=5"></script>
<script>
var _deleteIds = new Set();

function _getVendorName(k){ return VENDOR_MAP && VENDOR_MAP[k] ? VENDOR_MAP[k].n : k; }
function _getVendorColor(k){ return VENDOR_MAP && VENDOR_MAP[k] ? VENDOR_MAP[k].c : '#666'; }
function _getCatLabel(k){ return (catLabels||{})[k] || (CAT_MAP||{})[k] || k; }
function _esc(s){ if(!s) return ''; var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function _handleAction(sel, id){
 var action=sel.value;
 sel.value='';
 if(action==='view') location.href='cmd_detail.html?id='+id;
 else if(action==='edit') location.href='cmd_edit.html?id='+id;
 else if(action==='delete') _deleteItem(id);
}

function _renderTable(data){
 var s=document.getElementById('searchInput').value.trim().toLowerCase();
 var vf=document.getElementById("vendorFilter");
 var activeV=vf ? vf.value : '';
 var cf=document.getElementById("catFilter");
 var activeC=cf ? cf.value : '';
 var list=data;
 if(activeV) list=list.filter(function(t){
  return t.configs && t.configs.some(function(cfg){return cfg.vendor===activeV;});
 });
 if(activeC) list=list.filter(function(t){return t.cat===activeC;});
 if(s) list=list.filter(function(t){
  return (t.title||'').toLowerCase().indexOf(s)!==-1 || ((t.desc||'').toLowerCase().indexOf(s)!==-1);
 });
 var tbody=document.getElementById('adminTbody');
 var no=document.getElementById('noResult');
 document.getElementById('statsLabel').textContent='共'+list.length+'条';
 if(list.length===0){ tbody.innerHTML=''; no.style.display='block'; return; }
 no.style.display='none';
 var html='';
 for(var i=0;i<list.length;i++){
  var t=list[i];
  var vendorBadges='';
  if(t.configs&&t.configs.length){
   vendorBadges=t.configs.map(function(cfg){
    var vc=_getVendorColor(cfg.vendor);
    return '<span style="display:inline-block;padding:2px 8px;margin:1px 3px;border-radius:10px;font-size:11px;background:'+vc+'15;color:'+vc+';border:1px solid '+vc+'40">'+_getVendorName(cfg.vendor)+'</span>';
   }).join('');
  }
  html+='<tr><td><input type="checkbox" class="select-item" value="'+t.id+'" '+(_deleteIds.has(t.id)?'checked':'')+' onchange="_toggleItem(this)"></td>';
  html+='<td>'+(i+1)+'</td><td>'+_esc(t.title)+'</td>';
  html+='<td>'+vendorBadges+'</td>';
  html+='<td>'+_getCatLabel(t.cat)+'</td>';
  html+='<td>'+(t.created_at||'')+'</td>';
  html+='<td><select class="action-select" onchange="_handleAction(this,\''+t.id+'\')"><option value="">操作</option><option value="view">查看</option><option value="edit">编辑</option><option value="delete">删除</option></select></td></tr>';
 }
 tbody.innerHTML=html;
}

function _toggleSelectAll(){
 var cb=document.getElementById('selectAll');
 var items=document.querySelectorAll('.select-item');
 for(var i=0;i<items.length;i++){
  items[i].checked=cb.checked;
  if(cb.checked) _deleteIds.add(items[i].value); else _deleteIds.delete(items[i].value);
 }
 _updateBatchBar();
}
function _toggleItem(cb){
 if(cb.checked) _deleteIds.add(cb.value); else _deleteIds.delete(cb.value);
 _updateBatchBar();
}
function _updateBatchBar(){
 var el=document.getElementById('batchBar');
 var cnt=_deleteIds.size;
 el.style.display=cnt?'flex':'none';
 document.getElementById('selectedCount').textContent='已选择 '+cnt+' 项';
}

async function _deleteItem(id){
 if(!confirm('确定要删除这条命令吗？')) return;
 try{
  var res=await fetch('/api/topics/'+encodeURIComponent(id),{method:'DELETE'});
  if(!res.ok) throw new Error();
  _deleteIds.delete(id);
  _loadDataAndRender();
 }catch(e){ alert('删除失败，请重试'); }
}

async function _batchDelete(){
 if(_deleteIds.size===0){ alert('请先勾选要删除的项目'); return; }
 if(!confirm('确定要删除已选择的 '+_deleteIds.size+' 项吗？此操作不可撤销！')) return;
 try{
  var ids=[];
  _deleteIds.forEach(function(v){ids.push(v);});
  var res=await fetch('/api/topics/batch-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:ids})});
  if(!res.ok) throw new Error();
  _deleteIds.clear();
  _loadDataAndRender();
  _updateBatchBar();
 }catch(e){ alert('批量删除失败，请重试'); }
}

var _cmdData = [];
async function _loadDataAndRender(){
 try{
  var r=await fetch('/api/topics');
  if(!r.ok) throw new Error('API error');
  _cmdData=await r.json();
  _renderTable(_cmdData);
 }catch(e){ console.error('加载失败:',e); document.getElementById('adminTbody').innerHTML='<tr><td colspan="7" style="text-align:center;padding:40px;color:#94a3b8">数据加载失败，请刷新重试</td></tr>'; }
}

function _initVendorFilter(){
 var vf=document.getElementById('vendorFilter');
 if(!vf) return;
 if(typeof VENDOR_MAP==='undefined'){ setTimeout(_initVendorFilter,100); return; }
 var keys=Object.keys(VENDOR_MAP);
 for(var i=0;i<keys.length;i++){
  var k=keys[i]; var v=VENDOR_MAP[k];
  var o=document.createElement('option'); o.value=k; o.textContent=v.n; vf.appendChild(o);
 }
 vf.addEventListener('change',function(){ _deleteIds.clear(); _updateBatchBar(); _renderTable(_cmdData); });
}

function _initCatFilter(){
 var cf=document.getElementById('catFilter');
 if(!cf) return;
 if(typeof CAT_MAP==='undefined'){ setTimeout(_initCatFilter,100); return; }
 var catKeys=Object.keys(CAT_MAP);
 for(var i=0;i<catKeys.length;i++){
  var ck=catKeys[i];
  var o=document.createElement('option'); o.value=ck; o.textContent=_getCatLabel(ck); cf.appendChild(o);
 }
 cf.addEventListener('change',function(){ _deleteIds.clear(); _updateBatchBar(); _renderTable(_cmdData); });
}

document.addEventListener('DOMContentLoaded',async function(){
 _initVendorFilter();
 _initCatFilter();
 document.getElementById('searchInput').addEventListener('input',function(){_renderTable(_cmdData);});
 document.getElementById('selectAll').addEventListener('change',_toggleSelectAll);
 if(window.initSidebarDropdowns) window.initSidebarDropdowns();
 await _loadDataAndRender();
});
</script>
</body>
