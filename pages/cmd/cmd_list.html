<div class="main-wrap">
<div class="page">
<div class="top-bar">
<h2>网络命令列表</h2>
<div class="top-actions"><span id="statsLabel" class="stats-label">共0条</span></div>
</div>
<div class="search-row" style="position:relative">
<input type="text" id="searchInput" placeholder="搜索命令..." autocomplete="off">
<select id="vendorFilter"><option value="">全部厂商</option></select>
<select id="catFilter"><option value="">全部分类</option></select>
</div>

<div id="noResult" class="no-result" style="display:none;text-align:center;padding:60px 20px;color:#94a3b8;font-size:16px">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:16px;opacity:.4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><br>没有匹配的结果
</div>
<div class="cmd-grid" id="cmdsGrid"></div>
</div>

<script src="../../common.js?v=5"></script>
<script>
var activeVendor = null, activeCat = null;
function renderList(){
 var s=document.getElementById('searchInput').value.trim().toLowerCase();
 var list=topics.filter(function(t){
  if(activeCat && t.cat!==activeCat) return false;
  if(activeVendor && (!t.configs || !t.configs.some(function(c){return c.vendor===activeVendor;}))) return false;
  if(s && !t.title.toLowerCase().includes(s) && !(t.desc||'').toLowerCase().includes(s)) return false;
  return true;
 });
 var g=document.getElementById('cmdsGrid'),no=document.getElementById('noResult');
 document.getElementById('statsLabel').textContent='共'+list.length+'条';
 if(list.length===0){g.innerHTML='';no.style.display='block';return;}
 no.style.display='none';
 g.innerHTML=list.map(function(t){
  var vendorTags='';
  if(t.configs&&t.configs.length){
   vendorTags=t.configs.map(function(cfg){
    var vc=getVendorColor(cfg.vendor);
    return '<span class="tag tag-vendor" style="background:'+vc+'15;color:'+vc+';font-size:11px;margin-right:4px">'+getVendorName(cfg.vendor)+'</span>';
   }).join('');
  }
  return '<div class="cmd-card" onclick="location.href=\'cmd_detail.html?id='+t.id+'\'"><div class="cmd-card-body"><h3>'+esc(t.title)+'</h3><div style="margin-top:6px">'+vendorTags+'<span class="tag tag-time" style="margin-left:6px">'+getCatLabel(t.cat)+'</span>'+((t.created_at)?'<span class="tag tag-time">'+formatTime(t.created_at)+'</span>':'')+'</div></div></div>';
 }).join('');
}
function initCatStrip(){var el=document.getElementById('catStrip');el.innerHTML='';var ab=document.createElement('button');ab.textContent='全部';ab.className='active';ab.onclick=function(){activeCat='';document.querySelectorAll('#catStrip button').forEach(function(b){b.classList.remove('active');});ab.classList.add('active');renderList();};el.appendChild(ab);getAllCategories().forEach(function(k){var btn=document.createElement('button');btn.textContent=getCatLabel(k);btn.onclick=function(){activeCat=k;document.querySelectorAll('#catStrip button').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');renderList();};el.appendChild(btn);});}
function initFilters(){
 var vf=document.getElementById('vendorFilter'),cf=document.getElementById('catFilter');
 if(!vf||!cf) return;
 if(typeof VENDOR_MAP==='undefined'){ setTimeout(initFilters,100); return; }
 Object.entries(VENDOR_MAP).forEach(function(e){var k=e[0],v=e[1];var o=document.createElement('option');o.value=k;o.textContent=v.n;vf.appendChild(o);});
 getAllCategories().forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=getCatLabel(k);cf.appendChild(o);});
 vf.addEventListener('change',function(){activeVendor=vf.value||null;renderList();});
 cf.addEventListener('change',function(){activeCat=cf.value||null;renderList();});
 document.getElementById('searchInput').addEventListener('input',renderList);
}

document.addEventListener('DOMContentLoaded',async function(){await loadData();initCatStrip();initFilters();renderList();initSidebarDropdowns();initSearchHistory('searchInput','cmd');});
</script>
