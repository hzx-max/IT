<div class="main-wrap">
<div class="page">
<div class="detail-page">
<div class="top-bar">
<h2>添加网络命令</h2>
<div class="top-actions">
<button class="btn btn-outline" onclick="location.href='cmd_admin.html'">返回管理</button>
</div>
</div>
<div class="form-card">
<div class="form-group">
<label>标题 <span class="required">*</span></label>
<input type="text" id="addTitle" placeholder="请输入标题">
</div>
<div class="form-group"><label>分类</label><select id="addCat"></select></div>
<div class="form-group"><label>描述</label><textarea id="addDesc" rows="3" placeholder="请输入描述"></textarea></div>
<div class="form-group"><label>详细内容</label><textarea id="addDetail" rows="8" placeholder="请输入详细内容"></textarea></div>

<div class="form-group">
<label>厂商配置</label>
<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
<select id="vendorSelect"><option value="">选择厂商...</option></select>
<button class="btn btn-primary" onclick="addVendorCard()" style="padding:6px 16px;font-size:13px;white-space:nowrap">+ 添加厂商</button>
</div>
<div id="vendorCards"></div>
</div>

<div class="form-actions">
<button class="btn btn-primary" onclick="submitAdd()">保存</button>
<button class="btn btn-outline" onclick="location.href='cmd_admin.html'">取消</button>
</div>
</div>

<script src="../../common.js?v=2"></script>
<script>
var addedVendors = {};

function _getVendorColor(k){ return VENDOR_MAP && VENDOR_MAP[k] ? VENDOR_MAP[k].c : '#666'; }
function _getVendorName(k){ return VENDOR_MAP && VENDOR_MAP[k] ? VENDOR_MAP[k].n : k; }

function initForm(){
 var vs=document.getElementById('vendorSelect');
 if(!vs) return;
 if(typeof VENDOR_MAP==='undefined'){ setTimeout(initForm,100); return; }
 Object.keys(VENDOR_MAP).forEach(function(k){
  var o=document.createElement('option'); o.value=k; o.textContent=VENDOR_MAP[k].n; vs.appendChild(o);
 });
 var cs=document.getElementById('addCat');
 if(cs){
  Object.keys(CAT_MAP).forEach(function(k){
   var o=document.createElement('option'); o.value=k; o.textContent=CAT_MAP[k]; cs.appendChild(o);
  });
 }
}

function addVendorCard(){
 var vs=document.getElementById('vendorSelect');
 var vk=vs.value;
 if(!vk) return;
 if(addedVendors[vk]){ showToast('该厂商已添加'); return; }
 addedVendors[vk]=true;
 var container=document.getElementById('vendorCards');
 var vn=_getVendorName(vk);
 var vc=_getVendorColor(vk);
 var card=document.createElement('div');
 card.id='vendorCard_'+vk;
 card.style.cssText='border:1.5px solid '+vc+'40;border-radius:8px;padding:16px;margin-bottom:12px;background:'+vc+'08';
 card.innerHTML=
  '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
  '<span style="font-weight:600;color:'+vc+';font-size:16px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+vc+';margin-right:8px;vertical-align:middle"></span>'+vn+'</span>'+
  '<button onclick="removeVendorCard(\''+vk+'\')" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:18px;line-height:1">&times;</button></div>'+
  '<div style="margin-bottom:10px"><div style="font-weight:600;margin-bottom:4px;font-size:13px;color:var(--text)">配置命令</div><textarea class="vendor-'+vk+'-config" rows="6" placeholder="输入'+vn+'的配置命令..." style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:4px;font-size:15px;outline:none;font-family:\'Cascadia Code\',\'Fira Code\',Consolas,monospace;line-height:1.6;resize:vertical;box-sizing:border-box"></textarea></div>'+
  '<div style="margin-bottom:10px"><div style="font-weight:600;margin-bottom:4px;font-size:13px;color:var(--text)">配置说明</div><textarea class="vendor-'+vk+'-comment" rows="3" placeholder="输入'+vn+'的配置说明..." style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:4px;font-size:15px;outline:none;font-family:inherit;line-height:1.6;resize:vertical;box-sizing:border-box"></textarea></div>'+
  '<div style="margin-bottom:10px"><div style="font-weight:600;margin-bottom:4px;font-size:13px;color:var(--text)">参考文档URL</div><input class="vendor-'+vk+'-doc" type="url" placeholder="https://..." style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:4px;font-size:15px;outline:none;font-family:inherit;box-sizing:border-box"></div>'+
  '<div><div style="font-weight:600;margin-bottom:4px;font-size:13px;color:var(--text)">验证命令</div><textarea class="vendor-'+vk+'-verify" rows="4" placeholder="输入'+vn+'的验证命令..." style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:4px;font-size:15px;outline:none;font-family:\'Cascadia Code\',\'Fira Code\',Consolas,monospace;line-height:1.6;resize:vertical;box-sizing:border-box"></textarea></div>';
 container.appendChild(card);
 vs.value='';
}

function removeVendorCard(vk){
 delete addedVendors[vk];
 var card=document.getElementById('vendorCard_'+vk);
 if(card) card.remove();
}

function collectConfigs(){
 var configs=[];
 Object.keys(addedVendors).forEach(function(vk){
  var configEl=document.querySelector('.vendor-'+vk+'-config');
  var cmtEl=document.querySelector('.vendor-'+vk+'-comment');
  var docEl=document.querySelector('.vendor-'+vk+'-doc');
  var verifyEl=document.querySelector('.vendor-'+vk+'-verify');
  var config=configEl?configEl.value.trim():'';
  var comment=cmtEl?cmtEl.value.trim():'';
  var doc=docEl?docEl.value.trim():'';
  var verifyCmd=verifyEl?verifyEl.value.trim():'';
  configs.push({vendor:vk,config:config,comment:comment,doc:doc,verification_cmd:verifyCmd,verification_images:[]});
 });
 return configs;
}

async function submitAdd(){
 var title=document.getElementById('addTitle').value.trim();
 if(!title){showToast('请输入标题');return;}
 var cat=document.getElementById('addCat')?document.getElementById('addCat').value:'';
 var desc=document.getElementById('addDesc')?document.getElementById('addDesc').value:'';
 var detail=document.getElementById('addDetail')?document.getElementById('addDetail').value:'';
 var configs=collectConfigs();
 try{
  var res=await fetch('/api/topics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title,cat:cat,desc:desc,detail:detail,configs:configs})});
  if(!res.ok){ var err=await res.text(); try{var ej=JSON.parse(err);showToast(ej.error||'保存失败');}catch(e2){showToast('保存失败');} return; }
  showToast('保存成功');
  setTimeout(function(){location.href='cmd_admin.html';},800);
 }catch(e){showToast('保存失败');}
}

document.addEventListener('DOMContentLoaded',async function(){initForm();if(window.initSidebarDropdowns) window.initSidebarDropdowns();});
</script>
