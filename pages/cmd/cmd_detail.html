<script src="../../common.js?v=4"></script>
<script>
var currentId = null;

function _getVendorColor(k){ return VENDOR_MAP && VENDOR_MAP[k] ? VENDOR_MAP[k].c : '#666'; }
function _getVendorName(k){ return VENDOR_MAP && VENDOR_MAP[k] ? VENDOR_MAP[k].n : k; }
function _getCatLabel(k){ return (catLabels||{})[k] || (CAT_MAP||{})[k] || k; }

async function loadDetail(){
 var params=new URLSearchParams(location.search);
 var id=params.get('id');
 if(!id){document.getElementById('detailContent').innerHTML='<div class="error">缺少ID参数</div>';return;}
 currentId=id;
 try{
  var res=await fetch('/api/topics/'+encodeURIComponent(id));
  if(!res.ok)throw new Error();
  var d=await res.json();
  document.getElementById('detailTitle').textContent=d.title;
  document.getElementById('editBtn').style.display='';
  document.title=d.title+' - IT运维学习平台';

  var html='';

  if(d.desc){html+='<div class="detail-section"><div class="detail-label">描述</div><div class="detail-value">'+esc(d.desc)+'</div></div>';}
  if(d.detail){html+='<div class="detail-section"><div class="detail-label">详细内容</div><div class="detail-value" style="white-space:pre-wrap">'+esc(d.detail)+'</div></div>';}

  var configs = d.configs || [];
  if(configs.length > 0){
   configs.sort(function(a,b){return Object.keys(VENDOR_MAP).indexOf(a.vendor)-Object.keys(VENDOR_MAP).indexOf(b.vendor);});
   html+='<div class="detail-section"><div class="detail-label">厂商配置</div><div class="vendor-tabs" id="configTabs">';
   configs.forEach(function(cfg,i){
    var vc=_getVendorColor(cfg.vendor);
    html+='<button class="vendor-tab'+(i===0?' active':'')+'" data-vendor="'+cfg.vendor+'" style="'+(i===0?'background:'+vc+';border-color:'+vc+';color:#fff':'')+'" onclick="switchConfigTab(this,\''+cfg.vendor+'\')"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+vc+';margin-right:6px;vertical-align:middle"></span>'+esc(_getVendorName(cfg.vendor))+'</button>';
   });
   html+='</div>';
   configs.forEach(function(cfg,i){
    html+='<div class="config-tab-content" id="config_'+cfg.vendor+'" style="'+(i===0?'':'display:none')+'">';
    if(cfg.config){
     html+='<div style="margin-bottom:16px"><div style="font-weight:600;margin-bottom:8px;color:var(--text)">配置命令</div><pre style="background:#0f172a;color:#e2e8f0;padding:14px 18px;border-radius:var(--radius-xs);font-size:15px;overflow-x:auto;white-space:pre;font-family:\'Cascadia Code\',\'Fira Code\',Consolas,monospace;line-height:1.7">'+esc(cfg.config)+'</pre></div>';
    }
    if(cfg.comment){
     html+='<div style="margin-bottom:12px;padding:10px 14px;background:var(--primary-light);border-radius:var(--radius-xs)"><span style="color:var(--primary);font-weight:600">配置说明：</span>'+esc(cfg.comment)+'</div>';
    }
    if(cfg.doc){
     html+='<div style="margin-bottom:12px"><strong>参考文档：</strong><a href="'+esc(cfg.doc)+'" target="_blank" rel="noopener" style="color:var(--primary);text-decoration:none">'+esc(cfg.doc)+'</a></div>';
    }
    if(cfg.verification_cmd){
     html+='<div><div style="font-weight:600;margin-bottom:8px;color:var(--text)">验证命令</div><pre style="background:#0f172a;color:#e2e8f0;padding:14px 18px;border-radius:var(--radius-xs);font-size:15px;overflow-x:auto;white-space:pre;font-family:\'Cascadia Code\',\'Fira Code\',Consolas,monospace;line-height:1.7">'+esc(cfg.verification_cmd)+'</pre></div>';
    }
    if(cfg.verification_images && cfg.verification_images.length){
     html+='<div style="margin-top:12px"><div style="font-weight:600;margin-bottom:8px;color:var(--text)">验证截图</div><div style="display:flex;flex-wrap:wrap;gap:10px">';
     cfg.verification_images.forEach(function(img){html+='<a href="'+esc(img)+'" target="_blank"><img src="'+esc(img)+'" style="max-width:200px;max-height:120px;border-radius:4px;border:1px solid var(--border)" onerror="this.style.display=\'none\'"></a>';});
     html+='</div></div>';
    }
    html+='</div>';
   });
   html+='</div>';
  }

  html+='<div class="detail-section" id="noteSection"><div class="detail-label">学习笔记</div><textarea class="note-textarea" id="noteContent" rows="4" placeholder="在此记录你的学习笔记..." style="width:100%"></textarea><div class="note-actions"><span class="note-status" id="noteStatus"></span><button class="btn btn-primary" onclick="saveNote()" style="padding:6px 18px;font-size:14px">保存笔记</button></div></div>';

  if(d.created_at){html+='<div class="detail-section"><div class="detail-label">创建时间</div><div class="detail-value">'+d.created_at+'</div></div>';}

  document.getElementById('detailContent').innerHTML=html;

  loadNote(id);
 }catch(e){document.getElementById('detailContent').innerHTML='<div class="error">加载失败: '+e.message+'</div>';}
}

function switchConfigTab(btn,vk){
 document.querySelectorAll('#configTabs .vendor-tab').forEach(function(b){b.style.background='';b.style.borderColor='';b.style.color='';b.classList.remove('active');});
 btn.classList.add('active');var vc=_getVendorColor(vk);
 btn.style.background=vc;btn.style.borderColor=vc;btn.style.color='#fff';
 document.querySelectorAll('.config-tab-content').forEach(function(el){el.style.display='none';});
 var target=document.getElementById('config_'+vk);
 if(target)target.style.display='block';
}

async function loadNote(id){
 try{
  var res=await fetch('/api/notes/'+encodeURIComponent(id));
  var data=await res.json();
  if(data.content){
   document.getElementById('noteContent').value=data.content;
   document.getElementById('noteStatus').textContent='上次保存: '+(new Date().toLocaleString());
  }
 }catch(e){}
}

async function saveNote(){
 var id=currentId;
 var content=document.getElementById('noteContent').value;
 try{
  await fetch('/api/notes/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});
  document.getElementById('noteStatus').textContent='已保存 '+new Date().toLocaleString();
 }catch(e){showToast('保存失败');}
}

document.addEventListener('DOMContentLoaded',function(){loadDetail();initSidebarDropdowns();});
</script>
