<div class="main-wrap">
<div class="page">
<div class="top-bar">
<h2>网络故障列表</h2>
<div class="top-actions"><span id="statsLabel" class="stats-label">共0条</span></div>
</div>
<div class="search-row" style="position:relative">
<input type="text" id="searchInput" placeholder="搜索故障..." autocomplete="off">


</div>
<div class="cat-strip" id="catStrip"></div>
<div id="noResult" class="no-result" style="display:none;text-align:center;padding:60px 20px;color:#94a3b8;font-size:16px">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:16px;opacity:.4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><br>没有匹配的结果
</div>
<div class="cmd-grid" id="faultsGrid"></div>
</div>
</div>
<script src="../../common.js"></script>
<script>
let faults = [];
function renderList(){
 const s=document.getElementById('searchInput').value.trim().toLowerCase();
 let list=faults.filter(d=>{if(s&&!d.title.toLowerCase().includes(s)&&!(d.symptom||d.desc||'').toLowerCase().includes(s))return false;return true;});
 const g=document.getElementById('faultsGrid'),no=document.getElementById('noResult');
 document.getElementById('statsLabel').textContent='共'+list.length+'条';
 if(list.length===0){g.innerHTML='';no.style.display='block';return;}
 no.style.display='none';
 g.innerHTML=list.map(d=>{return`<div class="cmd-card" onclick="location.href='fault_detail.html?id=${d.id}'"><div class="cmd-card-body"><h3>${esc(d.title)}</h3><div class="p">${esc((d.symptom||d.desc||'').substring(0,100))}</div><div class="tags">${d.category?`<span class="tag tag-cat">${d.category}</span>`:''}${d.created_at?`<span class="tag tag-time">${formatTime(d.created_at)}</span>`:''}</div></div></div>`;}).join('');
}
document.getElementById('searchInput').addEventListener('input',renderList);

document.addEventListener('DOMContentLoaded',async function(){try{const r=await fetch('/api/faults');if(!r.ok)throw new Error();faults=await r.json();}catch(e){console.error(e);}renderList();initSidebarDropdowns();initSearchHistory('searchInput','fault');});
</script>
