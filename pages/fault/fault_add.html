<div class="main-wrap">
<div class="page">
<div class="detail-page">
<div class="top-bar">
<h2>添加故障</h2>
<div class="top-actions">
<button class="btn btn-outline" onclick="location.href='fault_admin.html'">返回管理</button>
</div>
</div>
<div class="form-card">
<div class="form-group">
<label>标题 <span class="required">*</span></label>
<input type="text" id="addTitle" placeholder="请输入标题">
</div>


<div class="form-group"><label>分类</label><input type="text" id="addCategory" placeholder="请输入分类"></div>
<div class="form-group"><label>症状描述</label><textarea id="addSymptom" rows="4" placeholder="请输入症状描述"></textarea></div>

<div class="form-group">
<label>详细内容</label>
<textarea id="addDetail" rows="8" placeholder="请输入详细内容"></textarea>
</div>
<div class="form-group"><label>解决方案</label><textarea id="addSolution" rows="6" placeholder="请输入解决方案"></textarea></div>
<div class="form-actions">
<button class="btn btn-primary" onclick="submitAdd()">保存</button>
<button class="btn btn-outline" onclick="location.href='fault_admin.html'">取消</button>
</div>
</div>
</div>
</div>
<script src="../../common.js"></script>
<script>
async function submitAdd(){
 const title=document.getElementById('addTitle').value.trim();
 if(!title){showToast('请输入标题');return;}
 const category=document.getElementById('addCategory')?.value.trim()||'';
 const symptom=document.getElementById('addSymptom')?.value.trim()||'';
 const solution=document.getElementById('addSolution')?.value.trim()||'';
 const detail=document.getElementById('addDetail')?.value.trim()||'';
 const id='fault_'+Date.now()+'_'+Math.random().toString(36).substring(2,8);
 try{
  const res=await fetch('/api/faults',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,title,category,symptom,solution,detail})});
  if(!res.ok)throw new Error();
  showToast('保存成功');
  setTimeout(()=>location.href='fault_admin.html',800);
 }catch(e){showToast('保存失败');}
}
document.addEventListener('DOMContentLoaded',async function(){await loadData();initSidebarDropdowns();});
</script>
