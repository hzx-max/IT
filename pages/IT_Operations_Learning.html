<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
<title>IT运维学习平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#1a73e8;--primary-dark:#0d47a1;--primary-light:#e8f0fe;--danger:#dc2626;--sidebar-bg:#0f172a;--sidebar-hover:#1e293b;--radius:12px;--radius-sm:8px;--radius-xs:4px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh}
.sidebar{width:220px;background:var(--sidebar-bg);color:#fff;position:fixed;height:100vh;z-index:100;display:flex;flex-direction:column}
.sidebar .logo{padding:18px 20px;border-bottom:1px solid #1e293b}
.sidebar .logo h1{font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px}
.sidebar .logo span{font-size:14px;color:#64748b;display:block;margin-top:2px}
.sidebar .nav-group{padding:12px 0;border-bottom:1px solid #1e293b;flex:1;overflow-y:auto;min-height:0}
.sidebar .nav-label{padding:10px 20px 6px;font-size:13px;color:#475569;text-transform:uppercase;letter-spacing:1.5px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 20px;border:none;background:none;color:#94a3b8;font-size:20px;cursor:pointer;text-align:left}
.nav-btn:hover{background:var(--sidebar-hover);color:#e2e8f0}
.nav-btn.active{background:var(--primary);color:#fff}
.sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid #1e293b;font-size:14px;color:#475569;flex-shrink:0}
.main-wrap{margin-left:220px;min-height:100vh}
.page{display:none;padding:24px 32px}
.page.active{display:block}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.top-bar h2{font-size:28px;font-weight:700}
.hero{text-align:center;padding:60px 20px 40px}
.hero h1{font-size:36px;font-weight:700;color:#0f172a;margin-bottom:12px}
.hero p{font-size:18px;color:#64748b;max-width:600px;margin:0 auto 32px;line-height:1.6}
.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;max-width:1200px;margin:0 auto;padding:0 20px}
.module-card{background:#fff;border-radius:12px;border:1.5px solid #e2e8f0;padding:24px;cursor:pointer;transition:all .25s ease}
.module-card:hover{border-color:#1a73e8;box-shadow:0 4px 12px rgba(26,115,232,.12);transform:translateY(-2px)}
.module-card h3{font-size:18px;font-weight:600;margin-bottom:8px;color:#0f172a}
.module-card p{font-size:14px;color:#64748b;margin-bottom:16px;line-height:1.5}
.module-card .tag{display:inline-block;padding:4px 12px;border-radius:12px;font-size:13px;font-weight:500}
.tag-blue{background:#e8f0fe;color:#1a73e8}
.tag-orange{background:#fff7ed;color:#f97316}
.tag-green{background:#ecfdf5;color:#059669}
.tag-purple{background:#f5f3ff;color:#7c3aed}
.tag-red{background:#fef2f2;color:#dc2626}
</style>
</head>
<body>
<nav class="sidebar">
<div class="logo"><h1><svg width="36" height="36" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#1a73e8"/><path d="M6 9h16M6 14h12M6 19h8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><circle cx="21" cy="19" r="4" fill="#34d399"/><path d="M19.5 19h3M21 17.5v3" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/></svg><span>IT运维学习平台</span></h1></div>
<div class="nav-group">
<div class="nav-label"></div>
<div class="nav-dropdown open">
<button class="nav-dropdown-toggle active"><svg width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span>网络命令</span><svg class="nav-dropdown-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg></button>
<div class="nav-dropdown-menu">
<button class="nav-btn active" onclick="location.href='cmd_list.html'"><span>命令列表</span></button>
<button class="nav-btn" onclick="location.href='cmd_admin.html'"><span>管理命令</span></button>
<button class="nav-btn" onclick="location.href='cmd_add.html'"><span>添加命令</span></button>
</div>
</div>
<div class="nav-dropdown">
<button class="nav-dropdown-toggle"><svg width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1v14M1 8h14"/><circle cx="8" cy="8" r="2.5"/><path d="M3 3l2 2M11 3l2 2M3 13l2-2M11 13l2-2" opacity="0.5"/></svg><span>网络故障</span><svg class="nav-dropdown-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg></button>
<div class="nav-dropdown-menu">
<button class="nav-btn" onclick="location.href='../fault/fault_list.html'"><span>故障列表</span></button>
<button class="nav-btn" onclick="location.href='../fault/fault_admin.html'"><span>管理故障</span></button>
<button class="nav-btn" onclick="location.href='../fault/fault_add.html'"><span>添加故障</span></button>
</div>
</div>
<div class="nav-dropdown">
<button class="nav-dropdown-toggle"><svg width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 6h6M5 8h4M5 10h5"/></svg><span>桌面运维</span><svg class="nav-dropdown-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg></button>
<div class="nav-dropdown-menu">
<button class="nav-btn" onclick="location.href='../desktop/desktop_list.html'"><span>桌面列表</span></button>
<button class="nav-btn" onclick="location.href='../desktop/desktop_admin.html'"><span>管理桌面</span></button>
<button class="nav-btn" onclick="location.href='../desktop/desktop_add.html'"><span>添加桌面</span></button>
</div>
</div>
<div class="nav-dropdown">
<button class="nav-dropdown-toggle"><svg width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 3h8l1 3-3 4 3 4-1 3H4l-1-3 3-4-3-4Z"/></svg><span>Linux</span><svg class="nav-dropdown-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg></button>
<div class="nav-dropdown-menu">
<button class="nav-btn" onclick="location.href='../linux/linux_list.html'"><span>Linux列表</span></button>
<button class="nav-btn" onclick="location.href='../linux/linux_admin.html'"><span>管理Linux</span></button>
<button class="nav-btn" onclick="location.href='../linux/linux_add.html'"><span>添加Linux</span></button>
</div>
</div>
<div class="nav-dropdown">
<button class="nav-dropdown-toggle"><svg width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2h8l2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"/><path d="M8 2v5l2-1 2 1V2"/></svg><span>Office</span><svg class="nav-dropdown-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg></button>
<div class="nav-dropdown-menu">
<button class="nav-btn" onclick="location.href='../office/office_list.html'"><span>Office列表</span></button>
<button class="nav-btn" onclick="location.href='../office/office_admin.html'"><span>管理Office</span></button>
<button class="nav-btn" onclick="location.href='../office/office_add.html'"><span>添加Office</span></button>
</div>
</div>
</div>
<div class="sidebar-footer"><kbd>ESC</kbd> 返回 | <kbd>Ctrl+K</kbd> 搜索</div>
</nav>

<div class="main-wrap">
<div class="page active">
<div class="hero">
<h1>IT运维学习平台</h1>
<p>涵盖网络命令、故障排查、桌面运维、Linux系统、Office办公等IT运维核心知识</p>
</div>
<div class="modules">
<div class="module-card" onclick="location.href='cmd/cmd_list.html'">
<h3>网络命令</h3>
<p>华为、H3C、Cisco等网络设备配置命令与管理</p>

</div>

<div class="module-card" onclick="location.href='office/office_list.html'">

</div>
</div>
</div>
<script>
document.querySelectorAll('.nav-btn').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));this.classList.add('active');});});
</script>
</body>
</html>
